status = warn
name = SparkLogConfig

# File appender
appender.file.type = File
appender.file.name = FILE
appender.file.fileName = /opt/spark/logs/spark-app.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Attach file appender to root logger
rootLogger.level = INFO
rootLogger.appenderRefs = file
rootLogger.appenderRef.file.ref = FILE

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN

logger.s3a.name = org.apache.hadoop.fs.s3a
logger.s3a.level = WARN

logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = INFO

logger.sparksql.name = org.apache.spark.sql
logger.sparksql.level = WARN
